<svg viewBox="0 0 960 560" role="img" aria-label="Six programs turn static maps and weather into a coupled fire run">
<defs><marker id="pl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="20" y="28" class="t-title">Six programs turn static maps and weather into a coupled fire run</text>
<text x="20" y="58" class="t-small" style="letter-spacing:1.4px">WPS · ONCE PER FIRE</text>
<rect x="10" y="66" width="940" height="240" rx="14" class="band"/>
<g>
<rect x="28" y="84" width="200" height="104" rx="10" class="box-file"/>
<text x="42" y="106" class="t-name">Static maps</text>
<text x="42" y="126" class="t-body">WPS_GEOG (terrain, land use,</text>
<text x="42" y="142" class="t-body">soil) · LANDFIRE fuel 30 m</text>
<text x="42" y="158" class="t-body">1″ fire terrain</text>
<text x="42" y="176" class="t-mono">+ GEOGRID.TBL</text>
</g>
<g>
<rect x="28" y="204" width="200" height="84" rx="10" class="box-file"/>
<text x="42" y="226" class="t-name">Weather GRIB2</text>
<text x="42" y="246" class="t-body">HRRR, NAM, GFS or ERA5</text>
<text x="42" y="264" class="t-body">one file per hour</text>
<text x="42" y="280" class="t-mono">+ Vtable</text>
</g>
<rect x="276" y="113" width="128" height="46" rx="10" class="box-strong"/>
<text x="340" y="141" text-anchor="middle" class="t-name">geogrid.exe</text>
<rect x="276" y="223" width="128" height="46" rx="10" class="box-strong"/>
<text x="340" y="251" text-anchor="middle" class="t-name">ungrib.exe</text>
<rect x="452" y="113" width="150" height="46" rx="10" class="box-file"/>
<text x="527" y="141" text-anchor="middle" class="t-mono">geo_em.d0N.nc</text>
<rect x="452" y="223" width="150" height="46" rx="10" class="box-file"/>
<text x="527" y="251" text-anchor="middle" class="t-mono">FILE:YYYY-MM-DD_HH</text>
<rect x="648" y="168" width="128" height="46" rx="10" class="box-strong"/>
<text x="712" y="196" text-anchor="middle" class="t-name">metgrid.exe</text>
<text x="712" y="232" text-anchor="middle" class="t-small">+ METGRID.TBL</text>
<rect x="804" y="168" width="134" height="46" rx="10" class="box-acc"/>
<text x="871" y="196" text-anchor="middle" class="t-mono">met_em.d0N.*.nc</text>
<g class="ln" marker-end="url(#pl-a)">
<path d="M228 136H274"/><path d="M404 136H450"/><path d="M228 246H274"/><path d="M404 246H450"/>
<path d="M602 136H624V182H646"/><path d="M602 246H624V200H646"/><path d="M776 191H802"/>
</g>
<text x="276" y="292" class="t-small">All three read namelist.wps: domains, dates, fire-grid ratio, data and table paths</text>
<text x="20" y="336" class="t-small" style="letter-spacing:1.4px">REAL AND WRF · ONCE PER SIMULATION</text>
<rect x="10" y="344" width="940" height="166" rx="14" class="band"/>
<rect x="804" y="384" width="134" height="46" rx="10" class="box-strong"/>
<text x="871" y="412" text-anchor="middle" class="t-name">real.exe</text>
<text x="871" y="450" text-anchor="middle" class="t-small">reads namelist.input</text>
<rect x="604" y="378" width="166" height="58" rx="10" class="box-file"/>
<text x="687" y="402" text-anchor="middle" class="t-mono">wrfinput_d0N</text>
<text x="687" y="422" text-anchor="middle" class="t-mono">wrfbdy_d01</text>
<rect x="372" y="384" width="190" height="46" rx="10" class="box-acc"/>
<text x="467" y="412" text-anchor="middle" class="t-name">wrf.exe + WRF-Fire</text>
<text x="467" y="450" text-anchor="middle" class="t-small">namelist.input (&amp;fire) + namelist.fire</text>
<rect x="40" y="378" width="270" height="58" rx="10" class="box-file"/>
<text x="175" y="402" text-anchor="middle" class="t-mono">wrfout_d0N  ·  wrfrst_d0N</text>
<text x="175" y="422" text-anchor="middle" class="t-mono">rsl.out.* / rsl.error.* logs</text>
<g class="ln" marker-end="url(#pl-a)">
<path d="M871 214V382"/><path d="M804 407H772"/><path d="M604 407H564"/><path d="M372 407H312"/>
</g>
<g>
<circle cx="228" cy="84" r="10" class="fill-acc"/><text x="228" y="88" text-anchor="middle" style="fill:var(--bg);font-size:11.5px;font-weight:700">1</text>
<circle cx="602" cy="223" r="10" class="fill-acc"/><text x="602" y="227" text-anchor="middle" style="fill:var(--bg);font-size:11.5px;font-weight:700">2</text>
<circle cx="770" cy="378" r="10" class="fill-acc"/><text x="770" y="382" text-anchor="middle" style="fill:var(--bg);font-size:11.5px;font-weight:700">3</text>
<circle cx="562" cy="384" r="10" class="fill-acc"/><text x="562" y="388" text-anchor="middle" style="fill:var(--bg);font-size:11.5px;font-weight:700">4</text>
</g>
<text x="20" y="540" class="t-body"><tspan class="t-acc" style="font-weight:600">Where research inputs enter: </tspan>1 a new static map  ·  2 an extra gridded weather field  ·  3 a per-cell field in wrfinput  ·  4 fuel tables, moisture model, ignition</text>
</svg>
