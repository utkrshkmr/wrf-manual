<svg viewBox="0 0 900 330" role="img" aria-label="A run's life: five steps and four classified endings">
<defs><marker id="lc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="20" y="28" class="t-title">Every run ends in one of four classes, each with a fixed response</text>
<g>
<rect x="20" y="52" width="160" height="58" rx="10" class="box"/><text x="34" y="76" class="t-name">1 · Folder, manifest</text><text x="34" y="96" class="t-small">sized from the table</text>
<rect x="196" y="52" width="160" height="58" rx="10" class="box"/><text x="210" y="76" class="t-name">2 · One copy per</text><text x="210" y="96" class="t-small">node type submitted</text>
<rect x="372" y="52" width="160" height="58" rx="10" class="box"/><text x="386" y="76" class="t-name">3 · First to start</text><text x="386" y="96" class="t-small">takes the lock; rest exit</text>
<rect x="548" y="52" width="160" height="58" rx="10" class="box"/><text x="562" y="76" class="t-name">4 · 15 minutes in</text><text x="562" y="96" class="t-small">rate measured, time set</text>
<rect x="724" y="52" width="156" height="58" rx="10" class="box-acc"/><text x="738" y="76" class="t-name">5 · Runs</text><text x="738" y="96" class="t-small">chained past 72 h</text>
</g>
<g class="ln" marker-end="url(#lc-a)"><path d="M180 81H194"/><path d="M356 81H370"/><path d="M532 81H546"/><path d="M708 81H722"/></g>
<path d="M802 110V140H110V158M802 140H330V158M802 140H550V158M802 140H770V158" class="ln"/>
<g>
<rect x="20" y="160" width="190" height="130" rx="10" class="box-green"/><text x="34" y="184" class="t-name t-green">Finished</text><text x="34" y="206" class="t-small">SUCCESS in rank 0's log</text><text x="34" y="226" class="t-small">→ continuation cancelled</text><text x="34" y="246" class="t-small">→ gate E, published</text>
<rect x="235" y="160" width="190" height="130" rx="10" class="box-amber"/><text x="249" y="184" class="t-name" style="fill:var(--amber)">Fire reached the edge</text><text x="249" y="206" class="t-small">"reached domain boundary"</text><text x="249" y="226" class="t-small">in any rank's log, exit 137</text><text x="249" y="246" class="t-small">→ outputs kept, domain</text><text x="249" y="262" class="t-small">   flagged; not a crash</text>
<rect x="450" y="160" width="190" height="130" rx="10" class="box-red"/><text x="464" y="184" class="t-name t-red">WRF crash</text><text x="464" y="206" class="t-small">CFL, NaN or segfault</text><text x="464" y="226" class="t-small">in any rank's log</text><text x="464" y="246" class="t-small">→ continuation cancelled</text><text x="464" y="262" class="t-small">→ a person is alerted</text>
<rect x="665" y="160" width="215" height="130" rx="10" class="box"/><text x="679" y="184" class="t-name">Killed, clean logs</text><text x="679" y="206" class="t-small">TIMEOUT, OUT_OF_MEMORY,</text><text x="679" y="226" class="t-small">node failure</text><text x="679" y="246" class="t-small">→ retry once from the newest</text><text x="679" y="262" class="t-small">   restart; memory → 512 GB</text>
</g>
<text x="20" y="318" class="t-small">A sweeper every 15 minutes compares Slurm's view with the ledger and classifies any job that died without reporting.</text>
</svg>
