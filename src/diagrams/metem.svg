<svg viewBox="0 0 900 330" role="img" aria-label="A met_em file holds fields on three kinds of grid">
<text x="20" y="28" class="t-title">One met_em file per domain per hour, holding fields on three kinds of grid</text>
<g>
<text x="40" y="62" class="t-small" style="letter-spacing:1.4px">3-D WEATHER · PRESSURE LEVELS</text>
<path d="M60 250l90-30h150l-90 30z" class="box-blue"/>
<path d="M60 220l90-30h150l-90 30z" class="box-blue"/>
<path d="M60 190l90-30h150l-90 30z" class="box-blue"/>
<path d="M60 160l90-30h150l-90 30z" class="box-blue"/>
<path d="M60 130l90-30h150l-90 30z" class="box-blue"/>
<text x="40" y="282" class="t-mono">TT UU VV RH GHT PRES</text>
<text x="40" y="300" class="t-mono">QC QR QI QS QG (HRRR)</text>
<text x="40" y="318" class="t-small">num_metgrid_levels layers</text>
</g>
<g>
<text x="350" y="62" class="t-small" style="letter-spacing:1.4px">2-D, ATMOSPHERE GRID</text>
<path d="M370 200l90-30h150l-90 30z" class="box-green"/>
<path d="M370 160l90-30h150l-90 30z" class="box"/>
<text x="350" y="232" class="t-mono">PSFC PMSL SKINTEMP SNOW</text>
<text x="350" y="250" class="t-mono">SOILT000…300 SOILM000…300</text>
<text x="350" y="268" class="t-mono">HGT_M LU_INDEX LANDUSEF …</text>
<text x="350" y="286" class="t-small">surface and soil weather + static</text>
<text x="350" y="304" class="t-small">fields copied from geo_em</text>
</g>
<g>
<text x="620" y="62" class="t-small" style="letter-spacing:1.4px">2-D, FIRE MESH (sr × finer)</text>
<path d="M630 180l90-30h150l-90 30z" class="box-acc"/>
<path d="M667.5 180l90-30M705 180l90-30M742.5 180l90-30M652.5 172.5h150M675 165h150M697.5 157.5h150" stroke="var(--accent)" stroke-width="0.7" fill="none" opacity="0.6"/>
<text x="620" y="232" class="t-mono">NFUEL_CAT  ZSF</text>
<text x="620" y="250" class="t-mono">DZDXF  DZDYF</text>
<text x="620" y="268" class="t-small">dims west_east_subgrid ×</text>
<text x="620" y="286" class="t-small">south_north_subgrid</text>
<text x="620" y="304" class="t-small">+ any subgrid=yes layer</text>
</g>
</svg>
