<svg viewBox="0 0 900 430" role="img" aria-label="Four ways to give WRF-Fire its fuel moisture, from one number to a moisture model">
<defs><marker id="fr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="20" y="28" class="t-title">Four routes to FMC_G, the dead fuel moisture the spread rate reads</text>
<text x="20" y="52" class="t-small">left to right: more detail in space and time, more inputs to prepare</text>
<g>
<rect x="20" y="66" width="200" height="260" rx="12" class="box"/>
<text x="36" y="92" class="t-small t-acc" style="letter-spacing:1.4px">A · DEFAULT</text>
<text x="36" y="114" class="t-name">One number</text>
<text x="36" y="140" class="t-mono">fire_fmc_read = 1</text>
<text x="36" y="160" class="t-mono">fuelmc_g = 0.08</text>
<text x="36" y="180" class="t-small">(namelist.fire)</text>
<rect x="56" y="200" width="128" height="72" rx="4" fill="var(--accent)" opacity="0.35"/>
<text x="36" y="300" class="t-body">same in every cell,</text>
<text x="36" y="316" class="t-body">all run long</text>
</g>
<g>
<rect x="240" y="66" width="200" height="260" rx="12" class="box-acc"/>
<text x="256" y="92" class="t-small t-acc" style="letter-spacing:1.4px">B · PER-CELL MAP</text>
<text x="256" y="114" class="t-name">Your map, fire mesh</text>
<text x="256" y="140" class="t-mono">fire_fmc_read = 0</text>
<text x="256" y="160" class="t-mono">FMC_G in wrfinput_d02</text>
<text x="256" y="180" class="t-small">(written after real.exe)</text>
<g>
<rect x="276" y="200" width="32" height="36" fill="var(--accent)" opacity="0.15"/><rect x="308" y="200" width="32" height="36" fill="var(--accent)" opacity="0.35"/><rect x="340" y="200" width="32" height="36" fill="var(--accent)" opacity="0.55"/><rect x="372" y="200" width="32" height="36" fill="var(--accent)" opacity="0.25"/>
<rect x="276" y="236" width="32" height="36" fill="var(--accent)" opacity="0.45"/><rect x="308" y="236" width="32" height="36" fill="var(--accent)" opacity="0.2"/><rect x="340" y="236" width="32" height="36" fill="var(--accent)" opacity="0.7"/><rect x="372" y="236" width="32" height="36" fill="var(--accent)" opacity="0.4"/>
</g>
<text x="256" y="300" class="t-body">varies cell by cell,</text>
<text x="256" y="316" class="t-body">fixed in time</text>
</g>
<g>
<rect x="460" y="66" width="200" height="260" rx="12" class="box"/>
<text x="476" y="92" class="t-small t-acc" style="letter-spacing:1.4px">C · BY SIZE CLASS</text>
<text x="476" y="114" class="t-name">5 classes, atm grid</text>
<text x="476" y="140" class="t-mono">fmoist_interp = .true.</text>
<text x="476" y="160" class="t-mono">FMC_GC (1h…live)</text>
<text x="476" y="180" class="t-small">weighted by each fuel's loads</text>
<g>
<rect x="496" y="200" width="128" height="14" rx="3" fill="var(--accent)" opacity="0.6"/>
<rect x="496" y="218" width="128" height="14" rx="3" fill="var(--accent)" opacity="0.45"/>
<rect x="496" y="236" width="128" height="14" rx="3" fill="var(--accent)" opacity="0.32"/>
<rect x="496" y="254" width="128" height="14" rx="3" fill="var(--accent)" opacity="0.2"/>
<rect x="496" y="272" width="128" height="14" rx="3" fill="var(--green)" opacity="0.35"/>
</g>
<text x="476" y="300" class="t-body">per class, interpolated</text>
<text x="476" y="316" class="t-body">to fuels, fixed in time</text>
</g>
<g>
<rect x="680" y="66" width="200" height="260" rx="12" class="box-blue"/>
<text x="696" y="92" class="t-small t-blue" style="letter-spacing:1.4px">D · MOISTURE MODEL</text>
<text x="696" y="114" class="t-name">Driven by weather</text>
<text x="696" y="140" class="t-mono">fmoist_run = .true.</text>
<text x="696" y="160" class="t-mono">fmoist_interp = .true.</text>
<text x="696" y="180" class="t-small">from T2, Q2, PSFC, rain</text>
<path d="M716 270C740 230 760 280 784 236S830 214 850 250" class="ln-blue"/>
<path d="M716 284H850" class="axis"/>
<text x="696" y="300" class="t-body">varies in space and</text>
<text x="696" y="316" class="t-body">time, lags per class</text>
</g>
<text x="20" y="358" class="t-body"><tspan class="t-acc" style="font-weight:600">B is the route for a fine-grained moisture map.</tspan> It needs no model changes and works with any fuel codes.</text>
<text x="20" y="380" class="t-body"><tspan style="font-weight:600;fill:var(--amber)">C and D need care with LANDFIRE codes:</tspan> in WRF 4.6 their class weights are looked up by the raw</text>
<text x="20" y="400" class="t-body">fuel code in a 60-row table, so codes 101–204 fall outside it. Test on a small case first.</text>
</svg>
