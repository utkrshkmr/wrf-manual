<svg viewBox="0 0 900 260" role="img" aria-label="Every run's measurements rebuild a lookup table weekly, which sizes the next run">
<defs><marker id="lk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<text x="20" y="28" class="t-title">Every past run sizes the next one, through a table rebuilt every week</text>
<rect x="20" y="70" width="190" height="80" rx="10" class="box"/><text x="36" y="96" class="t-name">Every registered run</text><text x="36" y="118" class="t-small">its diag/ folder and</text><text x="36" y="134" class="t-small">ledger events</text>
<rect x="250" y="70" width="190" height="80" rx="10" class="box-strong"/><text x="266" y="96" class="t-name">Weekly refit</text><text x="266" y="118" class="t-small">one Slurm job,</text><text x="266" y="134" class="t-small">Sunday night</text>
<rect x="480" y="70" width="190" height="80" rx="10" class="box-acc"/><text x="496" y="96" class="t-name">Lookup table</text><text x="496" y="118" class="t-mono">calibration/2026-11-02</text><text x="496" y="134" class="t-small">current → newest; all kept</text>
<rect x="710" y="70" width="170" height="80" rx="10" class="box-strong"/><text x="726" y="96" class="t-mono">run.sh</text><text x="726" y="118" class="t-small">reads it before</text><text x="726" y="134" class="t-small">sizing a run</text>
<g class="ln" marker-end="url(#lk-a)"><path d="M210 110H248"/><path d="M440 110H478"/><path d="M670 110H708"/><path d="M795 150V196H115V152"/></g>
<text x="300" y="214" class="t-small">the new run's measurements feed the next table</text>
<text x="20" y="246" class="t-body">Exact match → its measured rate · same fire, new ranks → its fitted curve · new fire → device constants and the node formula, × 1.3</text>
</svg>
