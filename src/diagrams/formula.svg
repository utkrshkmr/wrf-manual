<svg viewBox="0 0 900 400" role="img" aria-label="Nine steps from a fire's grid to ranks, walltime and cost, worked for Cranston on Sapphire Rapids">
<text x="20" y="28" class="t-title">Nine steps from a fire's grid to ranks, walltime and cost (Cranston, Sapphire Rapids)</text>
<text x="20" y="58" class="t-small t-blue" style="letter-spacing:1.4px">FROM THE GRID</text>
<text x="320" y="58" class="t-small t-acc" style="letter-spacing:1.4px">FROM THE CALIBRATION</text>
<text x="620" y="58" class="t-small t-green" style="letter-spacing:1.4px">FROM THE WINDOW</text>
<g>
<rect x="20" y="68" width="270" height="88" rx="10" class="box-blue"/>
<text x="34" y="90" class="t-name">1 · Rank cap</text><text x="34" y="110" class="t-mono">⌊nx/10⌋ × ⌊ny/10⌋, tightest domain</text><text x="34" y="138" class="t-name t-blue">6 × 6 = 36</text>
<rect x="20" y="166" width="270" height="88" rx="10" class="box-blue"/>
<text x="34" y="188" class="t-name">2 · Ranks</text><text x="34" y="208" class="t-mono">small fire: the cap, one node</text><text x="34" y="236" class="t-name t-blue">n = 36</text>
<rect x="20" y="264" width="270" height="88" rx="10" class="box-blue"/>
<text x="34" y="286" class="t-name">3 · Patch side</text><text x="34" y="306" class="t-mono">√(column updates ÷ n)</text><text x="34" y="334" class="t-name t-blue">√(1,020,636 ÷ 36) = 168</text>
</g>
<g>
<rect x="320" y="68" width="270" height="88" rx="10" class="box-acc"/>
<text x="334" y="90" class="t-name">4 · Cost per update</text><text x="334" y="110" class="t-mono">a(type) × (1 + 110 ÷ side)</text><text x="334" y="138" class="t-name t-acc">114 × (1 + 110/168) = 188 µs</text>
<rect x="320" y="166" width="270" height="88" rx="10" class="box-acc"/>
<text x="334" y="188" class="t-name">5 · Seconds per step</text><text x="334" y="208" class="t-mono">updates × cost ÷ n</text><text x="334" y="236" class="t-name t-acc">5.32 s (measured 5.99)</text>
<rect x="320" y="264" width="270" height="88" rx="10" class="box"/>
<text x="334" y="286" class="t-name">9 · Charged core-hours</text><text x="334" y="306" class="t-mono">nodes × cores × walltime</text><text x="334" y="334" class="t-name">1 × 64 × 41.8 = 2,675</text>
</g>
<g>
<rect x="620" y="68" width="260" height="88" rx="10" class="box-green"/>
<text x="634" y="90" class="t-name">6 · Steps</text><text x="634" y="110" class="t-mono">window ÷ coarse time step</text><text x="634" y="138" class="t-name t-green">20 h × 3600 ÷ 3 s = 24,000</text>
<rect x="620" y="166" width="260" height="88" rx="10" class="box-green"/>
<text x="634" y="188" class="t-name">7 · Walltime</text><text x="634" y="208" class="t-mono">s/step × steps × 1.15 + 1 h</text><text x="634" y="236" class="t-name t-green">41.8 h (measured 41.6)</text>
<rect x="620" y="264" width="260" height="88" rx="10" class="box"/>
<text x="634" y="286" class="t-name">8 · Over 72 hours?</text><text x="634" y="306" class="t-mono">chain jobs via restart files</text><text x="634" y="334" class="t-name">fits in one job</text>
</g>
<text x="20" y="384" class="t-small">A fire never run before uses × 1.3 instead of × 1.15. The first 15 minutes of the real run replace step 5's estimate with a measured rate.</text>
</svg>
